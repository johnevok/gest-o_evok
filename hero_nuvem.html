z+=.026*G(x/.058,(y-.187)/.013)+.032*G(x/.052,(y-.124)/.016)-.014*G(x/.06,(y-.155)/.005)-.01*G((ax-.07)/.012,(y-.15)/.01)+.03*G(x/.075,(y-.048)/.035)-.018*G(x/.05,(y-.093)/.012);

const nrm=(F,ph,y)=>{const e1=.004,e2=.002,p=F(ph,y),a=F(ph+e1,y),b=F(ph,y+e2),u=[a[0]-p[0],a[1]-p[1],a[2]-p[2]],v=[b[0]-p[0],b[1]-p[1],b[2]-p[2]];

// cabelo curto e bagunçado

async function build(P,Nn,M,LS){

// visor
const hm=new Map(),hk=(a,b)=>(a+100)*1000+b;

const fh=(x,y)=>{const ci=Math.floor(x/.01),cj=Math.floor(y/.01);let m=-Infinity;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const z=hm.get(hk(ci+a,cj+b));if(z!==undefined&&z>m)m=z}return m};

const copy=(i,p)=>put(P[i*3],P[i*3+1],P[i*3+2],Nn[i*3],Nn[i*3+1],Nn[i*3+2],p);

for(let i=0;i<N;i++){if(i%5000===0){setProgress(.72+.27*i/N);await tick()}const x=pos[i*3],y=pos[i*3+1],z=pos[i*3+2],cx=Math.floor(x/RR),cy=Math.floor(y/RR),cz=Math.floor(z/RR);let c=0,sx=0,sy=0,sz=0;

const VS=`uniform float uTime,uAssemble,uSize,uGlint,uShine,uRingRadius;uniform vec2 uHead;uniform vec3 uLight,uRingCenter;

home=Rm*(home-piv)+piv;n=Rm*n;
home+=n*sin(uTime*1.4+aRand*60.)*.006;
float r2=fract(sin(aRand*91.7)*43758.5453);
float t=clamp((uAssemble-aRand*.45)/.55,0.,1.);
float e=t<.5?4.*t*t*t:1.-pow(-2.*t+2.,3.)/2.;
float ang=aRand*6.2831853,rr=uRingRadius*(1.+(r2-.5)*.06);
vec3 start=uRingCenter+vec3(cos(ang)*rr,sin(ang)*rr,0.);
vec3 p=mix(start,home,e);
p+=vec3(sin(aRand*40.+uTime*.3),cos(aRand*31.),.9+r2*1.4)*sin(e*3.14159265)*.45;
vec3 tl=uLight-home;float lit=max(dot(n,normalize(tl)),0.)/(1.+dot(tl,tl)*.32);
float key=max(dot(n,normalize(vec3(-.5,.6,.7))),0.);
float facing=normalize(normalMatrix*n).z,rim=pow(1.-abs(facing),3.);
float b=.3+key*.22+lit*1.5+rim*.14;
b*=mix(.55,1.,smoothstep(-.3,.25,facing));
float ridge=aShade.x,thin=aShade.y;
b*=ridge>0.?1.+ridge*.7:1.+ridge*.5;
b+=thin*(.26+key*.3);
float leaf=step(1.5,aPart)*step(aPart,2.5),frame=step(2.5,aPart)*step(aPart,3.5),lens=step(3.5,aPart);
b*=1.-.1*leaf;b*=mix(1.,.78,max(frame,lens));b*=mix(1.,.7,lens);
b*=.7+r2*.5;
float glint=(leaf+frame+lens)>.5?1.-smoothstep(0.,.09,abs(position.x-uGlint)):0.;
b+=glint*1.2;
float band=home.y-home.x*.5-uShine,shine=exp(-band*band*4.);
b+=shine*1.3;
vB=b;vA=mix(.75,1.,e);vLens=lens;vGlint=glint;vShine=shine;
vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
gl_PointSize=uSize*(.45+r2*r2*1.3)*(1.+shine*.6)/-mv.z;}`;
const FS=`uniform vec3 uInk,uBlue,uCream;varying float vB,vA,vLens,vGlint,vShine;
void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;float a=exp(-16.*r*r)*vA;
vec3 ink=mix(uInk,uCream,clamp(vShine*.6,0.,1.));ink=mix(ink,uBlue,.6*vLens);ink=mix(ink,uBlue,clamp(vGlint*.7,0.,1.));
gl_FragColor=vec4(ink*vB*a,1.);}`;
const LVS=`uniform vec3 uLight;uniform float uOn,uSize;void main(){vec4 mv=modelViewMatrix*vec4(uLight,1.);gl_Position=projectionMatrix*mv;gl_PointSize=uSize*uOn/-mv.z;}`;
const LFS=`uniform float uOn;void main(){float r=2.*length(gl_PointCoord-.5);if(r>1.)discard;float core=1.-smoothstep(.08,.14,r),glow=exp(-4.*r)*.45+exp(-12.*r)*.7;gl_FragColor=vec4(vec3(core+glow)*uOn,1.);}`;
const DVS=`uniform float uTime,uSize;attribute float aRand;varying float vR;
void main(){vec3 p=position;p.y=mod(p.y+uTime*(.03+aRand*.05)+6.,12.)-6.;p.x+=sin(uTime*.2+aRand*40.)*.15;vR=aRand;
vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;gl_PointSize=uSize*(.5+aRand)/-mv.z;}`;
const DFS=`uniform vec3 uInk;uniform float uOn;varying float vR;
void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;gl_FragColor=vec4(uInk*(.1+vR*.18)*uOn*exp(-16.*r*r),1.);}`;

function start(d){
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(dpr);renderer.setClearColor(0x0f110d,1);stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.1,100),T15=Math.tan(Math.PI/12),target=new THREE.Vector3(0,-.15,0);
const U={uTime:{value:0},uAssemble:{value:reduce?1:0},uSize:{value:26*dpr},uGlint:{value:-9},uShine:{value:99},uHead:{value:new THREE.Vector2()},uLight:{value:new THREE.Vector3(-1.4,1.2,1.6)},
uRingCenter:{value:target.clone()},uRingRadius:{value:1},uInk:{value:new THREE.Color('#c9d4b8')},uBlue:{value:new THREE.Color('#7fa8a3')},uCream:{value:new THREE.Color('#f0e5c8')}};
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(d.pos,3));g.setAttribute('normal',new THREE.BufferAttribute(d.nor,3));
g.setAttribute('aRand',new THREE.BufferAttribute(d.rand,1));g.setAttribute('aShade',new THREE.BufferAttribute(d.shade,2));g.setAttribute('aPart',new THREE.BufferAttribute(d.part,1));
const base={transparent:true,depthWrite:false,blending:THREE.AdditiveBlending};
const bust=new THREE.Points(g,new THREE.ShaderMaterial({...base,uniforms:U,vertexShader:VS,fragmentShader:FS}));bust.frustumCulled=false;scene.add(bust);
const LU={uLight:U.uLight,uOn:{value:reduce?1:0},uSize:{value:240*dpr}},lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(3),3));
const lp=new THREE.Points(lg,new THREE.ShaderMaterial({...base,uniforms:LU,vertexShader:LVS,fragmentShader:LFS}));lp.frustumCulled=false;scene.add(lp);
const dp=new Float32Array(900*3),dr=new Float32Array(900);for(let i=0;i<900;i++){dp[i*3]=-9+R()*18;dp[i*3+1]=-6+R()*12;dp[i*3+2]=-6+R()*8;dr[i]=R()}
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));dg.setAttribute('aRand',new THREE.BufferAttribute(dr,1));
const DU={uTime:U.uTime,uSize:{value:22*dpr},uInk:U.uInk,uOn:{value:reduce?1:0}};
const dust=new THREE.Points(dg,new THREE.ShaderMaterial({...base,uniforms:DU,vertexShader:DVS,fragmentShader:DFS}));dust.frustumCulled=false;scene.add(dust);
function resize(){const w=innerWidth,h=innerHeight,asp=w/h,dist=Math.max(2.35/T15,1.7/(T15*asp));
renderer.setSize(w,h);cam.aspect=asp;cam.updateProjectionMatrix();cam.position.set(0,-.15,dist);cam.lookAt(target);
U.uRingRadius.value=92*(2*dist*T15/h)}
addEventListener('resize',resize);resize();
const ptr=new THREE.Vector2(),ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),-3.6),hit=new THREE.Vector3(),head=new THREE.Vector2();
let active=false,touch=false,lastT=0;
const mv=e=>{ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1));active=true;touch=e.pointerType==='touch';lastT=performance.now()};
addEventListener('pointermove',mv);addEventListener('pointerdown',mv);document.documentElement.addEventListener('pointerleave',()=>active=false);
let last=performance.now(),t=0;
function frame(now){requestAnimationFrame(frame);
const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;const k=r=>1-Math.exp(-dt*r);
const asm=reduce?1:Math.min(1,t/2.6);U.uAssemble.value=asm;U.uTime.value=reduce?0:t;
if(asm>.55&&page.dataset.phase!=='ready')page.dataset.phase='ready';
if(!reduce){LU.uOn.value+=(Math.min(1,1.6*asm)-LU.uOn.value)*k(4);DU.uOn.value+=(1-DU.uOn.value)*k(.8);
if(t>2.34&&t<4.54){const s=(t-2.34)/2.2;U.uShine.value=2.6-(1-(1-s)*(1-s))*5.4}else U.uShine.value=99;
if(t>=4.6){const c=(t-4.6)%4.2;U.uGlint.value=c<.9?d.minX-.15+(d.maxX-d.minX+.3)*(c/.9):-9}}
const act=active&&(!touch||now-lastT<1500);let tl,th;
if(act){ray.setFromCamera(ptr,cam);if(!ray.ray.intersectPlane(plane,hit))hit.copy(U.uLight.value);tl=hit;th=[.5*ptr.x,.18*ptr.y]}
else{tl=new THREE.Vector3(1.9*Math.sin(.45*t),.5+.8*Math.cos(.33*t),3.6);th=[.35*Math.sin(.45*t),.12*Math.cos(.33*t)]}
if(reduce){U.uLight.value.copy(tl);head.set(0,0)}else{U.uLight.value.lerp(tl,k(5));const hr=act?k(3):k(1.5);head.x+=(th[0]-head.x)*hr;head.y+=(th[1]-head.y)*hr}
U.uHead.value.set(head.x,-head.y);
renderer.render(scene,cam)}
requestAnimationFrame(frame)}

(async()=>{try{
const g=await generate(),data=await build(g.P,g.Nn,g.M,g.LS);setProgress(1);if(!reduce)await new Promise(r=>setTimeout(r,380));start(data)
}catch(e){console.error(e);counter.textContent='Falha ao carregar';counter.style.fontSize='18px';label.textContent='Atualize a página'}})();
